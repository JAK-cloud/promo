name: PromoFrontDeploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_SERVER }} << 'EOF'
            
            DEPLOY_DIR=~/marketing.noodobakers.com
            BUILD_DIR=~/promo.noodobaker.source
            REPO_URL=git@github.com:JAK-cloud/promo.git
            BRANCH=main

            mkdir -p "$BUILD_DIR" 
            cd "$BUILD_DIR" || exit 1

            if [ ! -d ".git" ]; then
              git init
              git remote add origin "$REPO_URL"
            else
              git remote set-url origin "$REPO_URL"
            fi

            git fetch origin
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
          
            npm install
            
            rm -rf dist
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            VITE_PORTAL_URL=${{ secrets.VITE_PORTAL_URL }} \
            npm run build

            [ -d dist ] || { echo "Build failed: dist/ not found, It means bulid was failed some where, check your script again please"; exit 1; }

            cd "$DEPLOY_DIR" || exit 1
            if [ "$DEPLOY_DIR" = "/" ]; then
              echo "Refusing to deploy to /"
              exit 1
            fi
            
            rm -rf ./*
            
            cp -r "$BUILD_DIR/dist/"* "$DEPLOY_DIR/"
            
            echo "Seems All is Well"
          EOF
